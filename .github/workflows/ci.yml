name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    # 固定 22.04：ubuntu-latest 已切到 26.04，不再提供 Python 3.9
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cyf/project/server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../../../requirements.txt

      - name: Prepare runtime config
        run: cp conf/conf.ini.tpl conf/conf.ini

      - name: Run pytest
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### pytest failed (exit '"$code"')'
              echo '```'
              tail -120 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 无日志权限时也能从 job annotation 看到失败原因
            echo "::error::pytest exit $code: $(tail -12 /tmp/pytest.log | tr '\n' ' ' | cut -c1-800)"
          fi
          exit "$code"

  frontend:
    name: Frontend typecheck + tests + build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cyf/project/fe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cyf/project/fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
